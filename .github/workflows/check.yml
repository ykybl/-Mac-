name: Check Syntax
on: [push]
permissions:
  contents: write
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
      - name: Compile and Push Log
        run: |
          export THEOS=~/theos
          cd HWHealthSideload
          make > compile.log 2>&1 || true
          find . -name "*.dylib" -exec cp {} ../HWHealthSideload.dylib \; || true
          cd ..
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Auto compile and upload dylib" || true
          git push || true
